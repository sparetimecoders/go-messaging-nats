name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: CI
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats@sha256:bbfbb6c4cdaeb8a2e3ca57d3de30463a66a6c5181f324f3b680bcf858833d377 # latest
        ports:
          - "4222:4222"
    steps:
      - name: Wait for NATS
        run: timeout 30 bash -c 'until nc -z localhost 4222; do sleep 0.5; done'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Tests
        run: |
          go test -count=1 -race -coverprofile=coverage.txt -covermode=atomic -coverpkg="$(go list ./... | grep -v /cmd/ | tr '\n' , | sed 's/,$//')" ./...
          go tool cover -func=coverage.txt
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
      - run: go vet ./...
      - name: Build TCK adapter
        run: go build ./cmd/tck-adapter/
